# Managed by deploy/setup_memory_hygiene.sh — journald on a 32 GB SD card.
# The journal had grown to 304 MB with no cap: it never stops writing on a
# 24/7 rover, and the DHT11 kernel-driver errors add a line every few seconds
# while the app polls the sensor.  Cap it so SD wear and journald's RSS stay
# bounded.
[Journal]
SystemMaxUse=64M
