<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Rover BLE Dashboard</title>
    <style>
        :root {
            --bg: #0f111a;
            --card: #1e2130;
            --inset: #141622;
            --border: #2e344e;
            --text: #fff;
            --sub: #a0a5b5;
            --blue: #00adb5;
            --green: #2ecc71;
            --red: #e74c3c;
            --amber: #f5a623;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }

        h2 {
            margin: 0 0 16px;
            font-size: 1.4rem;
            text-align: center;
            color: var(--blue);
        }

        /* Connection indicator */
        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--c);
            background: color-mix(in srgb, var(--c) 14%, transparent);
            transition: background .3s, border-color .3s;
        }

        .status[data-state="disconnected"] {
            --c: var(--red);
        }

        .status[data-state="connecting"] {
            --c: var(--amber);
        }

        .status[data-state="connected"] {
            --c: var(--green);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--c);
            flex: none;
        }

        .status[data-state="connecting"] .dot,
        .status[data-state="connected"] .dot {
            animation: pulse 1.6s ease-out infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent);
            }

            100% {
                box-shadow: 0 0 0 10px transparent;
            }
        }

        .status-text {
            flex: 1;
            min-width: 0;
        }

        #status-label {
            font-weight: 700;
            color: var(--c);
            font-size: .95rem;
        }

        #status-detail {
            font-size: .78rem;
            color: var(--sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #uptime {
            font-variant-numeric: tabular-nums;
            font-size: .85rem;
            color: var(--sub);
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 0;
            border-radius: 6px;
            font-size: .95rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: transform .1s, background-color .2s, opacity .2s;
        }

        .btn:active:not(:disabled) {
            transform: scale(.98);
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--blue);
        }

        .btn-primary:hover:not(:disabled) {
            background: #008c93;
        }

        .btn-success {
            background: var(--green);
        }

        .btn-danger {
            background: var(--red);
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--sub);
        }

        .btn-ghost:hover:not(:disabled) {
            color: var(--text);
            border-color: var(--sub);
        }

        .section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: .9rem;
            color: var(--sub);
            margin: 0;
        }

        .section-head .btn {
            width: auto;
            margin: 0;
            padding: 4px 10px;
            font-size: .78rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: .9rem;
        }

        input:disabled {
            opacity: .5;
        }

        .pass-wrap {
            position: relative;
        }

        .pass-wrap input {
            padding-right: 64px;
        }

        .pass-toggle {
            position: absolute;
            right: 6px;
            top: 6px;
            padding: 6px 8px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--sub);
            font-size: .78rem;
            cursor: pointer;
        }

        .pass-toggle:hover {
            color: var(--text);
        }

        .ip-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .ip-row input {
            margin: 0;
            flex: 1;
        }

        .ip-row .port {
            padding: 12px;
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--sub);
            font-size: .9rem;
            font-variant-numeric: tabular-nums;
        }

        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-grid .btn {
            margin-top: 0;
            flex: 1 1 130px;
        }

        #terminal {
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            background: #0d0e15;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: .75rem;
            line-height: 1.5;
        }

        .line {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #4dd0e1;
        }

        .line.success {
            color: var(--green);
        }

        .line.error {
            color: #ff6b5e;
        }

        .line.warn {
            color: var(--amber);
        }

        .line.muted {
            color: var(--sub);
        }

        .ts {
            color: var(--sub);
            margin-right: 6px;
        }

        .hint {
            margin: 12px 0 0;
            font-size: .72rem;
            color: var(--sub);
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .dot {
                animation: none !important;
            }

            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Rover Bluetooth Controller</h2>

        <!-- Connection indicator -->
        <div id="status" class="status" data-state="disconnected" role="status" aria-live="polite">
            <span class="dot"></span>
            <div class="status-text">
                <div id="status-label">Disconnected</div>
                <div id="status-detail">No rover connected</div>
            </div>
            <span id="uptime"></span>
        </div>
        <button id="btn-connect" class="btn btn-primary">Connect to Rover</button>

        <!-- Wi-Fi -->
        <div class="section">
            <div class="section-head">
                <h3 class="section-title">Wi-Fi credentials</h3>
            </div>
            <input type="text" id="wifi-ssid" placeholder="Wi-Fi SSID (name)" autocomplete="off" class="needs-conn"
                disabled>
            <div class="pass-wrap">
                <input type="password" id="wifi-pass" placeholder="Wi-Fi password" autocomplete="off" class="needs-conn"
                    disabled>
                <button type="button" class="pass-toggle" id="pass-toggle">Show</button>
            </div>
            <button id="btn-wifi" class="btn btn-primary needs-conn" disabled>Send Wi-Fi credentials</button>
        </div>

        <!-- Server -->
        <div class="section">
            <div class="section-head">
                <h3 class="section-title">Rover server</h3>
            </div>
            <div class="ip-row">
                <input type="text" id="server-ip" placeholder="Server IP, e.g. 192.168.1.50" inputmode="decimal"
                    autocomplete="off">
                <span class="port">:5000</span>
            </div>
            <button id="btn-getip" class="btn btn-ghost needs-conn" disabled>Get IP from rover</button>
            <button id="btn-open" class="btn btn-primary" disabled>Open rover server</button>
        </div>

        <!-- Service -->
        <div class="section">
            <div class="section-head">
                <h3 class="section-title">Rover app</h3>
            </div>
            <div class="btn-grid">
                <button class="btn btn-success needs-conn" data-cmd="START" disabled>Start app</button>
                <button class="btn btn-danger needs-conn" data-cmd="STOP" disabled>Stop app</button>
                <button class="btn btn-ghost needs-conn" data-cmd="RESTART_ROVER" disabled>Restart rover
                    service</button>
            </div>
            <div class="section-head" style="margin-top:14px">
                <h3 class="section-title">Camera stream</h3>
            </div>
            <button class="btn btn-ghost needs-conn" data-cmd="RESTART_MEDIAMTX" disabled>Restart MediaMTX</button>
            <button id="btn-update" class="btn btn-ghost needs-conn" disabled>Update rover code</button>
            <button id="btn-commit" class="btn btn-ghost needs-conn" disabled>Commit changes</button>
        </div>

        <!-- Log -->
        <div class="section">
            <div class="section-head">
                <h3 class="section-title">Activity log</h3>
                <button id="btn-clear" class="btn btn-ghost">Clear log</button>
            </div>
            <div id="terminal" aria-live="off"></div>
        </div>

        <p class="hint">Web Bluetooth needs Chrome or Edge, and the page must be opened over HTTPS or localhost.</p>
    </div>

    <script>
        // Must match bt.py on the Pi
        const SERVICE_UUID = "12345678-1234-5678-1234-56789abcdef0";
        const WIFI_CHAR_UUID = "12345678-1234-5678-1234-56789abcdef1";
        const CONTROL_CHAR_UUID = "12345678-1234-5678-1234-56789abcdef2";

        const $ = (id) => document.getElementById(id);
        let bleDevice = null, bleService = null, connectedAt = null, uptimeTimer = null, state = "disconnected";

        /* ---------- Log ---------- */
        function log(message, level = "info") {
            const term = $("terminal");
            const line = document.createElement("div");
            line.className = "line " + level;
            const ts = document.createElement("span");
            ts.className = "ts";
            ts.textContent = new Date().toLocaleTimeString();
            line.append(ts, message);
            term.appendChild(line);
            while (term.childElementCount > 300) term.firstChild.remove();
            term.scrollTop = term.scrollHeight;
        }
        function clearLog() {
            $("terminal").replaceChildren();
            log("Log cleared.", "muted");
        }

        /* ---------- UI state ---------- */
        function formatUptime(ms) {
            const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
            const pad = (n) => String(n).padStart(2, "0");
            return (h ? h + ":" : "") + pad(m) + ":" + pad(s % 60);
        }
        function setState(next, detail) {
            state = next;
            const labels = { disconnected: "Disconnected", connecting: "Connecting…", connected: "Connected" };
            $("status").dataset.state = next;
            $("status-label").textContent = labels[ next ];
            $("status-detail").textContent = detail || "";

            const btn = $("btn-connect");
            btn.disabled = next === "connecting";
            btn.className = "btn " + (next === "connected" ? "btn-ghost" : "btn-primary");
            btn.textContent = next === "connected" ? "Disconnect" : next === "connecting" ? "Connecting…" : "Connect to Rover";

            document.querySelectorAll(".needs-conn").forEach((el) => (el.disabled = next !== "connected"));

            clearInterval(uptimeTimer);
            if (next === "connected") {
                connectedAt = Date.now();
                $("uptime").textContent = "00:00";
                uptimeTimer = setInterval(() => ($("uptime").textContent = formatUptime(Date.now() - connectedAt)), 1000);
            } else {
                $("uptime").textContent = "";
            }
        }

        /* ---------- Connection ---------- */
        async function connectBluetooth() {
            if (!navigator.bluetooth) {
                log("Web Bluetooth is not supported in this browser. Use Chrome or Edge.", "error");
                return;
            }
            setState("connecting", "Searching for rover…");
            try {
                log("Searching for BLE devices…");
                bleDevice = await navigator.bluetooth.requestDevice({ filters: [ { services: [ SERVICE_UUID ] } ] });
                bleDevice.addEventListener("gattserverdisconnected", onDisconnected);

                const name = bleDevice.name || "Rover";
                setState("connecting", "Connecting to " + name + "…");
                log("Connecting to " + name + "…");
                const server = await bleDevice.gatt.connect();

                log("Discovering GATT services…");
                bleService = await server.getPrimaryService(SERVICE_UUID);

                setState("connected", name);
                log("Connected to " + name + ".", "success");
            } catch (err) {
                bleService = null;
                setState("disconnected", "No rover connected");
                // NotFoundError = user closed the picker
                log(err.name === "NotFoundError" ? "No device selected." : "Connection error: " + err.message,
                    err.name === "NotFoundError" ? "muted" : "error");
            }
        }

        function disconnectBluetooth() {
            if (bleDevice && bleDevice.gatt.connected) {
                log("Disconnecting…", "warn");
                bleDevice.gatt.disconnect(); // triggers onDisconnected
            }
        }

        function onDisconnected() {
            bleService = null;
            setState("disconnected", "Connection lost or closed");
            log("BLE device disconnected.", "warn");
        }

        /* ---------- Writes ---------- */
        async function writeText(uuid, text) {
            const ch = await bleService.getCharacteristic(uuid);
            const data = new TextEncoder().encode(text);
            if (ch.writeValueWithResponse) await ch.writeValueWithResponse(data);
            else await ch.writeValue(data);
        }

        async function sendWifiCredentials() {
            const ssid = $("wifi-ssid").value.trim();
            const pass = $("wifi-pass").value; // don't trim: passwords may contain spaces
            if (!ssid || !pass) { log("Enter both SSID and password.", "warn"); return; }

            const btn = $("btn-wifi");
            btn.disabled = true;
            try {
                log("Sending Wi-Fi credentials for " + ssid + "…");
                await writeText(WIFI_CHAR_UUID, ssid + ":" + pass);
                log("Wi-Fi credentials sent.", "success");
            } catch (err) {
                log("Wi-Fi error: " + err.message, "error");
            } finally {
                btn.disabled = state !== "connected";
            }
        }

        async function sendAppCommand(command, btn) {
            btn.disabled = true;
            try {
                log("Sending " + command + "…");
                await writeText(CONTROL_CHAR_UUID, command);
                log(command + " sent.", "success");
            } catch (err) {
                log("Command error: " + err.message, "error");
            } finally {
                btn.disabled = state !== "connected";
            }
        }

        /* ---------- Wire up ---------- */
        $("btn-connect").addEventListener("click", () => (state === "connected" ? disconnectBluetooth() : connectBluetooth()));
        $("btn-wifi").addEventListener("click", sendWifiCredentials);
        $("btn-clear").addEventListener("click", clearLog);
        document.querySelectorAll("[data-cmd]").forEach((b) => b.addEventListener("click", () => sendAppCommand(b.dataset.cmd, b)));
        $("pass-toggle").addEventListener("click", () => {
            const show = $("wifi-pass").type === "password";
            $("wifi-pass").type = show ? "text" : "password";
            $("pass-toggle").textContent = show ? "Hide" : "Show";
        });

        /* ---------- Server IP (port fixed at 5000) ---------- */
        const SERVER_PORT = 5000;
        const IPV4 = /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;

        function serverUrl() {
            const ip = $("server-ip").value.trim();
            return IPV4.test(ip) ? "http://" + ip + ":" + SERVER_PORT : null;
        }
        function updateServerUI() {
            const url = serverUrl();
            $("btn-open").disabled = !url;
            $("btn-open").textContent = url ? "Open " + url : "Open rover server";
        }

        const IP_CHAR_UUID = "12345678-1234-5678-1234-56789abcdef3";

        async function fetchServerIp() {
            const btn = $("btn-getip");
            btn.disabled = true;
            try {
                log("Asking rover for its IP address…");
                const ch = await bleService.getCharacteristic(IP_CHAR_UUID);
                const value = await ch.readValue();
                const ip = new TextDecoder().decode(value).trim();
                if (IPV4.test(ip)) {
                    $("server-ip").value = ip;
                    try { localStorage.setItem("roverServerIp", ip); } catch (e) { }
                    updateServerUI();
                    log("Rover IP: " + ip, "success");
                } else {
                    log("Rover has no IP address yet. Wait a few seconds after Wi-Fi connects, then try again.", "warn");
                }
            } catch (err) {
                log(err.name === "NotFoundError"
                    ? "IP characteristic not found. Add it to bt.py and restart the script."
                    : "IP error: " + err.message, "error");
            } finally {
                btn.disabled = state !== "connected";
            }
        }
        $("btn-getip").addEventListener("click", fetchServerIp);

        try { $("server-ip").value = localStorage.getItem("roverServerIp") || ""; } catch (e) { }
        updateServerUI();

        $("server-ip").addEventListener("input", () => {
            updateServerUI();
            try { localStorage.setItem("roverServerIp", $("server-ip").value.trim()); } catch (e) { }
        });
        $("btn-open").addEventListener("click", () => {
            const url = serverUrl();
            if (!url) return;
            log("Opening " + url, "info");
            window.open(url, "_blank", "noopener");
        });

        /* ---------- Git tasks on the Pi (update / commit) ---------- */
        const UPDATE_STATUS_UUID = "12345678-1234-5678-1234-56789abcdef4";
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        async function runGitTask(command, startMsg) {
            const btns = [ $("btn-update"), $("btn-commit") ];
            btns.forEach((b) => (b.disabled = true));
            try {
                log(startMsg);
                await writeText(CONTROL_CHAR_UUID, command);
                const ch = await bleService.getCharacteristic(UPDATE_STATUS_UUID);
                for (let i = 0; i < 45; i++) {           // wait up to ~90 s
                    await sleep(2000);
                    if (state !== "connected") {
                        log("Lost connection during " + command.toLowerCase() + ". Reconnect and try again to see the result.", "warn");
                        return;
                    }
                    const status = new TextDecoder().decode(await ch.readValue()).trim();
                    if (status.startsWith("RUNNING")) continue;
                    log(status, status.startsWith("OK") ? "success" : "error");
                    return;
                }
                log(command + " is taking longer than expected. Try again shortly.", "warn");
            } catch (err) {
                log(err.name === "NotFoundError"
                    ? "Update status characteristic not found. Add it to bt.py and restart the script."
                    : command + " error: " + err.message, "error");
            } finally {
                btns.forEach((b) => (b.disabled = state !== "connected"));
            }
        }

        $("btn-update").addEventListener("click", () => runGitTask("UPDATE", "Telling rover to pull updates…"));
        $("btn-commit").addEventListener("click", () => runGitTask("COMMIT", "Telling rover to commit changes…"));

        log('Ready. Tap "Connect to Rover" to scan.', "muted");
    </script>
</body>

</html>
