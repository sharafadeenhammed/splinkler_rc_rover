<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rover Controller</title>
  <link rel="stylesheet" href="/static/index.css">
</head>

<body>

  <div class="container">
    <br>
    <br>

    <div class="video-box-container">
      <div class="video-box">
        <img src="http://192.168.156.181:5000/stream" alt="Live Stream">
      </div>
    </div>

    <!-- camera tilt/pan control start -->
    <div class="camera-control-container">
      <h3>Camera Pan Control</h3>
      <div class="servo-controls">
        <button class="btn-servo" onclick="tiltCamera('left')">◀ Left</button>
        <button class="btn-servo btn-center" onclick="tiltCamera('center')">Center</button>
        <button class="btn-servo" onclick="tiltCamera('right')">Right ▶</button>
      </div>
      <p class="angle-display">Current Angle: <span id="current-angle">0</span>°</p>
    </div>
    <!-- camera tilt/pan control end -->

    <div class="control-panel">
      <div class="info-container">
        <!-- motot state -->
        <div style="width: 30%;">
          <div class="status-display">Motor: <span id="statusTxt">STOPPED</span></div>
        </div>
        <!-- slider container -->
        <div>
          <div>
            <label for="speedSlider">Speed Target Limit</label>
          </div>
          <input type="range" min="0" max="100" value="50" class="" id="speedSlider">
          <div>Power Target: <span id="targetVal" class="target-display">50</span>%</div>
        </div>
        <!-- sensor reading -->
        <div style="width: 30%;">
          <p class="status-display">Sensor Readings</p>
          <div class="status-display" id="sensorReadings"></div>
        </div>

      </div>
      <!-- end of slider -->
      <div class="btn-group-container">
        <div class="btn-group">
          <!-- forward nutton -->
          <button class="action-btn forward-btn" id="forwardBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M12 4l-8 8h6v8h4v-8h6l-8-8z" />
            </svg>
          </button>
          <!-- reverse button -->
          <button class="action-btn reverse-btn" id="reverseBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M12 20l8-8h-6V4h-4v8H4l8 8z" />
            </svg>
          </button>
          <!-- right button -->
          <button class="action-btn right-btn" id="rightBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M20 12l-8-8v6H4v4h8v6l8-8z" />
            </svg>
          </button>
          <!-- left button -->
          <button class="action-btn left-btn" id="leftBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M4 12l8-8v6h8v4h-8v6l-8-8z" />
            </svg>
          </button>

          <!-- stop button -->
          <button class="action-btn stop-btn" id="stopBtn">
            <svg width="20" height="20" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <rect width="100" height="100" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
      <!-- end of button group -->

    </div>
  </div>
  </div>

  <script src="/static/index.js"></script>
</body>

</html>
